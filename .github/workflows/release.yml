name: Release

# Manually-triggered release: bumps version, updates CHANGELOG, commits, tags,
# creates a GitHub Release, builds, packs, and publishes to NuGet.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump (X.Y.Z = UmbracoMajor.PackageMajor.PackageMinor)'
        required: true
        type: choice
        default: package-minor
        options:
          - package-minor
          - package-major
          - umbraco-major
          - explicit
      version:
        description: 'Explicit version (only used when bump=explicit). Format: X.Y.Z'
        required: false
        type: string
      dry_run:
        description: 'Compute and print only - do not commit, tag, push, or publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo '')
          echo "Last tag: ${LAST_TAG:-<none>}"

          if [ "${{ inputs.bump }}" = "explicit" ]; then
            NEW_VERSION="${{ inputs.version }}"
            if ! echo "$NEW_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Explicit version must match X.Y.Z, got '$NEW_VERSION'"
              exit 1
            fi
          else
            if [ -z "$LAST_TAG" ]; then
              echo "::error::No prior tag found - use bump=explicit with a starting version"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_TAG"
            case "${{ inputs.bump }}" in
              package-minor) PATCH=$((PATCH + 1)) ;;
              package-major) MINOR=$((MINOR + 1)); PATCH=0 ;;
              umbraco-major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          if git rev-parse "refs/tags/${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEW_VERSION} already exists"
            exit 1
          fi

          echo "New version: ${NEW_VERSION}"
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from commits
        id: notes
        env:
          LAST_TAG: ${{ steps.version.outputs.last_tag }}
        run: |
          set -euo pipefail
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:'%s' --no-merges \
            | grep -viE '^(chore\(release\)|bump version|merge )' || true)

          if [ -z "$COMMITS" ]; then
            echo "::error::No commits since ${LAST_TAG:-repo start} - nothing to release"
            exit 1
          fi

          ADDED=""
          CHANGED=""
          FIXED=""
          REMOVED=""
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            case "$LINE" in
              Added*|Add\ *)        ADDED="${ADDED}- ${LINE}"$'\n' ;;
              Fix*|Fixes*|Fixed*)   FIXED="${FIXED}- ${LINE}"$'\n' ;;
              Remove*|Removed*|Drop*|Delete*|Deleted*)
                                    REMOVED="${REMOVED}- ${LINE}"$'\n' ;;
              Update*|Updated*|Improve*|Improved*|Reorganize*|Reorganized*|Refactor*|Refactored*|Rename*|Renamed*)
                                    CHANGED="${CHANGED}- ${LINE}"$'\n' ;;
              *)                    CHANGED="${CHANGED}- ${LINE}"$'\n' ;;
            esac
          done <<< "$COMMITS"

          BLOCK="## [${{ steps.version.outputs.new_version }}] - ${{ steps.version.outputs.release_date }}"$'\n\n'
          [ -n "$ADDED" ]   && BLOCK="${BLOCK}### Added"$'\n'"${ADDED}"$'\n'
          [ -n "$CHANGED" ] && BLOCK="${BLOCK}### Changed"$'\n'"${CHANGED}"$'\n'
          [ -n "$FIXED" ]   && BLOCK="${BLOCK}### Fixed"$'\n'"${FIXED}"$'\n'
          [ -n "$REMOVED" ] && BLOCK="${BLOCK}### Removed"$'\n'"${REMOVED}"$'\n'

          echo "$BLOCK"

          {
            echo 'block<<EOF_BLOCK'
            echo "$BLOCK"
            echo 'EOF_BLOCK'
          } >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        env:
          BLOCK: ${{ steps.notes.outputs.block }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          block = os.environ["BLOCK"].rstrip() + "\n\n"
          m = re.search(r'^## \[', text, flags=re.MULTILINE)
          if m:
              text = text[:m.start()] + block + text[m.start():]
          else:
              text = text.rstrip() + "\n\n" + block
          path.write_text(text, encoding="utf-8")
          PY
          git diff -- CHANGELOG.md

      - name: Commit, tag, push
        if: ${{ inputs.dry_run == false }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          git add CHANGELOG.md
          git commit -m "Added changelog for ${NEW_VERSION}"
          git tag "${NEW_VERSION}"
          git push origin HEAD
          git push origin "${NEW_VERSION}"

      - name: Setup Node.js
        if: ${{ inputs.dry_run == false }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'DocTypeDoctor/src/DocTypeDoctor/Client/package-lock.json'

      - name: Setup .NET
        if: ${{ inputs.dry_run == false }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Client Assets
        if: ${{ inputs.dry_run == false }}
        run: |
          cd DocTypeDoctor/src/DocTypeDoctor/Client
          npm ci
          npm run build

      - name: Build & Pack
        if: ${{ inputs.dry_run == false }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: dotnet pack DocTypeDoctor/src/DocTypeDoctor/DocTypeDoctor.csproj -c Release /p:Version=${NEW_VERSION}

      - name: Push to NuGet
        if: ${{ inputs.dry_run == false }}
        run: dotnet nuget push **/*.nupkg -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          BLOCK: ${{ steps.notes.outputs.block }}
        run: |
          set -euo pipefail
          NOTES=$(printf '%s' "$BLOCK" | sed '1,/^$/d')
          gh release create "${NEW_VERSION}" \
            --title "${NEW_VERSION}" \
            --notes "$NOTES"

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice::Dry run complete. Would have released ${{ steps.version.outputs.new_version }} to NuGet."
