name: CI

# Builds the project on every push to main and on every PR targeting main,
# so broken builds are caught before release time.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'DocTypeDoctor/src/DocTypeDoctor/Client/package-lock.json'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Client Assets
        run: |
          cd DocTypeDoctor/src/DocTypeDoctor/Client
          npm ci
          npm run build

      - name: Build .NET
        run: dotnet build DocTypeDoctor/src/DocTypeDoctor/DocTypeDoctor.csproj -c Release
